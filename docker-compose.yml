# Local MySQL for clinic PC / developer testing.
# Start:  docker compose up -d
# Stop:   docker compose down
# Data persists in the Docker volume `eye_clinic_mysql`.

services:
  mysql:
    image: mysql:8.4
    container_name: eye-clinic-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eye_clinic
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
    volumes:
      - eye_clinic_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eye_clinic_mysql:
