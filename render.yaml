services:
  - type: web
    name: eye-clinic
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLINIC_PASSWORD
        generateValue: true
      - key: STORE_FILES_IN_DB
        value: "1"
      - key: MYSQL_SSL
        value: "1"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: eye_clinic
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BACKUP_CRON_SECRET
        sync: false
